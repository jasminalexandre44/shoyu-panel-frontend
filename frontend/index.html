<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SHOYU Panel</title>
<link rel="stylesheet" href="/css/style.css?v=20260907-5">
</head>
<body class="auth-boot">
<div class="auth-wrap">
    <div class="auth-layout">
        <div class="auth-card glass">
            <div class="brand brand-no-logo">
                <h2 id="brand-title" class="brand-wordmark brand-wordmark-login">SHOYU</h2>
                <p id="brand-subtitle">Management Panel</p>
            </div>
            <div class="auth-heading">
                <span class="auth-kicker">Sign in</span>
                <h1>Welcome back</h1>
                <p>Use your account to continue.</p>
            </div>
            <form id="login-form">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="auth-input-wrap"><span class="auth-input-mark">@</span><input type="text" id="username" autocomplete="username" placeholder="Enter your username" required></div>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="auth-input-wrap"><span class="auth-input-mark">*</span><input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button></div>
                </div>
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" class="btn block" id="login-btn">Login to panel <span aria-hidden="true">&#8594;</span></button>
            </form>
            <div class="auth-extra">
                <span>Need an account?</span>
                <a href="/pricing.html">View plans</a>
            </div>
        </div>
    </div>
</div>
<script src="/js/icons.js"></script>
<script src="/js/api.js?v=20260907-3"></script>
<script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("auth-error");
    const btn = document.getElementById("login-btn");
    const passwordToggle = document.getElementById("password-toggle");

    passwordToggle.addEventListener("click", () => {
        const password = document.getElementById("password");
        const visible = password.type === "text";
        password.type = visible ? "password" : "text";
        passwordToggle.textContent = visible ? "Show" : "Hide";
        passwordToggle.setAttribute("aria-label", visible ? "Show password" : "Hide password");
    });

    // Redirect authenticated users to the dashboard.
    api("/auth/me").then(() => window.location.href = "/dashboard.html").catch(() => {});

    loadBranding().then((b) => {
        if (!b) return;
        document.getElementById("brand-title").textContent = b.webName;
        document.getElementById("brand-subtitle").textContent = b.webSubtitle || b.loginTagline || "Management Panel";
        document.getElementById("brand-icon").innerHTML = b.logoPhoto
            ? `<img class="brand-photo splash-photo" src="${b.logoPhoto}" alt="${b.webName} logo">`
            : "";
        document.title = `Login - ${b.webName}`;
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Signing in...`;

        try {
            await api("/auth/login", {
                method: "POST",
                body: {
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value,
                },
            });
            window.location.href = "/dashboard.html";
        } catch (err) {
            errorEl.textContent = err.message;
            btn.disabled = false;
            btn.textContent = "Login";
        }
    });
</script>
</body>
</html>
